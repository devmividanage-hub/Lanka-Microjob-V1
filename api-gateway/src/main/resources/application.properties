spring.application.name=api-gateway
server.port=${SERVER_PORT:9000}

# --- Routes. Every browser call goes through the gateway, so this is the single CORS edge. ---
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://user-service:9001}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=job-service
spring.cloud.gateway.routes[1].uri=${JOB_SERVICE_URL:http://job-service:9002}
spring.cloud.gateway.routes[1].predicates[0]=Path=/jobs/**

# Job applications are served by the job-service: it owns the job rows the rules depend on.
spring.cloud.gateway.routes[2].id=job-service-applications
spring.cloud.gateway.routes[2].uri=${JOB_SERVICE_URL:http://job-service:9002}
spring.cloud.gateway.routes[2].predicates[0]=Path=/applications/**

spring.cloud.gateway.routes[3].id=matching-service
spring.cloud.gateway.routes[3].uri=${MATCHING_SERVICE_URL:http://matching-service:9003}
spring.cloud.gateway.routes[3].predicates[0]=Path=/matches/**

spring.cloud.gateway.routes[4].id=broker-service
spring.cloud.gateway.routes[4].uri=${BROKER_SERVICE_URL:http://broker-service:9004}
spring.cloud.gateway.routes[4].predicates[0]=Path=/brokers/**

spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=${NOTIFICATION_SERVICE_URL:http://notification-service:9005}
spring.cloud.gateway.routes[5].predicates[0]=Path=/notifications/**

# --- OpenAPI documents, aggregated behind the gateway: GET /api-docs/<service> ---
spring.cloud.gateway.routes[6].id=user-service-docs
spring.cloud.gateway.routes[6].uri=${USER_SERVICE_URL:http://user-service:9001}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api-docs/user-service
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/api-docs/user-service, /v3/api-docs

spring.cloud.gateway.routes[7].id=job-service-docs
spring.cloud.gateway.routes[7].uri=${JOB_SERVICE_URL:http://job-service:9002}
spring.cloud.gateway.routes[7].predicates[0]=Path=/api-docs/job-service
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/api-docs/job-service, /v3/api-docs

spring.cloud.gateway.routes[8].id=matching-service-docs
spring.cloud.gateway.routes[8].uri=${MATCHING_SERVICE_URL:http://matching-service:9003}
spring.cloud.gateway.routes[8].predicates[0]=Path=/api-docs/matching-service
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/api-docs/matching-service, /v3/api-docs

spring.cloud.gateway.routes[9].id=broker-service-docs
spring.cloud.gateway.routes[9].uri=${BROKER_SERVICE_URL:http://broker-service:9004}
spring.cloud.gateway.routes[9].predicates[0]=Path=/api-docs/broker-service
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/api-docs/broker-service, /v3/api-docs

spring.cloud.gateway.routes[10].id=notification-service-docs
spring.cloud.gateway.routes[10].uri=${NOTIFICATION_SERVICE_URL:http://notification-service:9005}
spring.cloud.gateway.routes[10].predicates[0]=Path=/api-docs/notification-service
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/api-docs/notification-service, /v3/api-docs

# The downstream services also apply CORS, so de-duplicate the headers instead of emitting two.
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

# --- CORS: set CORS_ALLOWED_ORIGINS to the real frontend origin(s) in production.
# Development defaults cover the docker frontend (:3000) and the Vite dev server (:5173). ---
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,X-Requested-With,Accept,Origin
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.probes.enabled=true
management.endpoint.gateway.enabled=${GATEWAY_ACTUATOR_ENABLED:false}
