# Shared secrets for the Lanka MicroJob cluster.
#
# THESE ARE DOCUMENTED DEVELOPMENT PLACEHOLDERS, NOT REAL CREDENTIALS.
# For a real deployment create this Secret out of band instead of committing it, e.g.
#   kubectl create secret generic lanka-microjob-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=INTERNAL_SERVICE_TOKEN="$(openssl rand -base64 32)" \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=SPRING_DATASOURCE_PASSWORD=... \
#     --from-literal=ADMIN_DEFAULT_PASSWORD=... \
#     --from-literal=SEED_DEMO_BROKER_PASSWORD=...
# JWT_SECRET must be at least 32 bytes (HS256 requirement).
apiVersion: v1
kind: Secret
metadata:
  name: lanka-microjob-secrets
type: Opaque
stringData:
  JWT_SECRET: "gQ3E1O6yFqh1QJcmDPFM0TSdqRKumfdTyi4EBnfVi7m"
