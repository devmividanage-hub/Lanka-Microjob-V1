apiVersion: v1
kind: ConfigMap
metadata:
  name: lanka-microjob-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lanka_microjob
  SPRING_JPA_DDL_AUTO: update
  JWT_EXPIRATION: "28800000"
  CORS_ALLOWED_ORIGINS: http://localhost:30300,http://localhost:30900
  NOTIFICATION_SERVICE_URL: http://notification-service:9005
  NOTIFICATION_CLIENT_ENABLED: "true"
  BROKER_COMMISSION_RATE: "0.075"
  ADMIN_DEFAULT_NAME: Platform Admin
  ADMIN_CONTACT_EMAIL: admin@gmail.com
  SEED_DEMO_DATA: "true"
  MATCHING_DISTRICT_BONUS: "10"
  MATCHING_BASE_WEIGHT: "90"
