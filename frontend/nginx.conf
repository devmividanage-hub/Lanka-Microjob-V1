server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy parameters shared by every backend location. Kept inline on purpose so this
    # file works no matter how it is mounted (docker run -v, compose, k8s ConfigMap).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # All API traffic goes to the gateway. Locations have NO trailing slash so that
    # requests for the collection path itself (GET /jobs, GET /applications) also match.
    location /auth/         { proxy_pass http://api-gateway:9000; }
    location /jobs          { proxy_pass http://api-gateway:9000; }
    location /applications  { proxy_pass http://api-gateway:9000; }
    location /matches       { proxy_pass http://api-gateway:9000; }
    location /brokers       { proxy_pass http://api-gateway:9000; }
    location /notifications { proxy_pass http://api-gateway:9000; }
    location /api-docs      { proxy_pass http://api-gateway:9000; }

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: unknown paths fall back to the built index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
