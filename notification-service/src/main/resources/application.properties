spring.application.name=notification-service
server.port=${SERVER_PORT:9005}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lanka_microjob}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lanka}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lanka}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:lanka_microjob_dev_only_jwt_secret_change_me_please_0123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}

# Shared secret for service-to-service writes (X-Internal-Token). Browsers never hold this value;
# only user-service, job-service and broker-service do.
notification.internal.token=${INTERNAL_SERVICE_TOKEN:lanka_internal_dev_token}

# IMPORTANT: this project ships simulated providers only. No real SMS gateway or mail server is
# contacted, so stored notifications are marked SIMULATED and the "delivery" is written to the log.
# Wire a real EmailNotificationProvider/SmsNotificationProvider here when credentials are available.
notification.provider.email=SIMULATED
notification.provider.sms=SIMULATED

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
