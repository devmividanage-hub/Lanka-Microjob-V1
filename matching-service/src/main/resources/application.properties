spring.application.name=matching-service
server.port=${SERVER_PORT:9003}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lanka_microjob}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lanka}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lanka}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Same shared secret as user-service so tokens issued there are accepted here.
jwt.secret=${JWT_SECRET:lanka_microjob_dev_only_jwt_secret_change_me_please_0123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}

# Rule-based scoring weights (no ML model is used - see MatchingService javadoc).
app.matching.district-bonus=${MATCHING_DISTRICT_BONUS:10}
app.matching.base-weight=${MATCHING_BASE_WEIGHT:90}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
