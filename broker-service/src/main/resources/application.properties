spring.application.name=broker-service
server.port=${SERVER_PORT:9004}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lanka_microjob}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lanka}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lanka}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Same shared secret as user-service/job-service: the admin token issued by user-service is
# accepted here so only an ADMIN can approve or reject brokers.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}

notification.service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:9005}
notification.internal.token=${INTERNAL_SERVICE_TOKEN:lanka_internal_dev_token}
notification.client.enabled=${NOTIFICATION_CLIENT_ENABLED:true}
job.service.url=${JOB_SERVICE_URL:http://job-service:9002}

# Where broker review notifications are sent (the bootstrap admin account).
app.admin.contact-email=${ADMIN_CONTACT_EMAIL:admin@gmail.com}

# Transparent platform commission charged per placement (7.5% as published in the broker agreement).
app.broker.commission-rate=${BROKER_COMMISSION_RATE:0.075}

# Seed one approved demo broker on an empty database so the broker flow can be demonstrated.
app.seed.demo-data=${SEED_DEMO_DATA:true}
app.seed.demo-broker-email=${SEED_DEMO_BROKER_EMAIL:demo.broker@lanka.lk}
app.seed.demo-broker-password=${SEED_DEMO_BROKER_PASSWORD:demo1234}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
