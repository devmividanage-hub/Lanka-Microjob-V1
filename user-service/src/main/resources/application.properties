spring.application.name=user-service
server.port=${SERVER_PORT:9001}

# --- Database (PostgreSQL in docker/k8s, override with env) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lanka_microjob}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lanka}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lanka}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- Security: JWT secret MUST come from the environment in any real deployment.
# The default below is a documented development-only placeholder. ---
jwt.secret=${JWT_SECRET:lanka_microjob_dev_only_jwt_secret_change_me_please_0123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- CORS: comma separated list of allowed browser origins ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}

# --- Notification service integration (mock provider, see notification-service) ---
notification.service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:9005}
notification.internal.token=${INTERNAL_SERVICE_TOKEN:lanka_internal_dev_token}
notification.client.enabled=${NOTIFICATION_CLIENT_ENABLED:true}

# --- Bootstrap admin account (created only when it does not exist yet) ---
app.admin.default-email=${ADMIN_DEFAULT_EMAIL:admin@gmail.com}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:admin123}
app.admin.default-name=${ADMIN_DEFAULT_NAME:System Admin}

# --- Observability / API docs ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
