spring.application.name=user-service
server.port=0
spring.datasource.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
jwt.secret=user_service_test_secret_key_0123456789_abcdefghijklmnop
jwt.expiration=3600000
app.cors.allowed-origins=http://localhost:3000
notification.service.url=
notification.client.enabled=false
notification.internal.token=test-internal-token
app.admin.default-email=admin@gmail.com
app.admin.default-password=admin123
app.admin.default-name=Test Admin
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
