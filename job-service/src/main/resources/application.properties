spring.application.name=job-service
server.port=${SERVER_PORT:9002}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lanka_microjob}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lanka}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lanka}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Must match the secret used by user-service so tokens issued there are accepted here.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}

notification.service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:9005}
notification.internal.token=${INTERNAL_SERVICE_TOKEN:lanka_internal_dev_token}
notification.client.enabled=${NOTIFICATION_CLIENT_ENABLED:true}

# Placement commission is derived in job-service from the locked job pay, never from browser input.
app.broker.commission-rate=${BROKER_COMMISSION_RATE:0.075}

# Insert a small demo job catalogue on an empty database (handy for demos, disable in production).
app.seed.demo-data=${SEED_DEMO_DATA:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
